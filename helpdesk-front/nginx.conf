server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API: repassa /api/... para o backend Spring Boot (servico "backend" do compose).
    # O resolver interno do Docker permite subir o nginx mesmo que o backend ainda
    # esteja inicializando.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # SPA: qualquer rota desconhecida volta para o index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
