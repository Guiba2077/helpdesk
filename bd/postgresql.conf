# =============================================================================
# postgresql.conf - Helpdesk TI (Tema G3)
# Montado em /etc/postgresql/postgresql.conf e carregado com -c config_file.
# PostgreSQL 16. Unidades aceitas: ms, s, min, h, kB, MB, GB.
# =============================================================================

# ---- Conexoes e rede --------------------------------------------------------
listen_addresses = '*'                  # quem pode conectar e decidido no pg_hba.conf
port = 5432
max_connections = 50                    # a aplicacao passa pelo PgBouncer; poucas conexoes reais bastam
superuser_reserved_connections = 3
password_encryption = scram-sha-256     # senhas gravadas em SCRAM, exigido pelo pg_hba.conf
authentication_timeout = 30s

# ---- Memoria (ambiente de demonstracao) -------------------------------------
shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 256MB

# ---- Timeouts no servidor ---------------------------------------------------
statement_timeout = 10s                      # cancela qualquer comando acima de 10s
                                             # a conta usr_helpdesk_leitor tem 3s (ALTER ROLE no backup.sql)
lock_timeout = 5s                            # nao espera mais de 5s por um bloqueio de linha ou tabela
idle_in_transaction_session_timeout = 30s    # derruba sessao que abriu transacao e ficou ociosa

# ---- Extensoes carregadas na inicializacao ----------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all

# ---- Logs (aparecem em: docker compose logs -f db) --------------------------
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 1000      # registra comandos que levaram mais de 1s
log_statement = 'mod'                  # registra INSERT, UPDATE, DELETE e DDL
log_connections = on
log_disconnections = on
log_lock_waits = on
log_checkpoints = on
log_line_prefix = '%m [%p] %u@%d %h '
log_timezone = 'America/Sao_Paulo'

# ---- Localizacao -------------------------------------------------------------
timezone = 'America/Sao_Paulo'
datestyle = 'iso, dmy'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.portuguese'

# ---- WAL, checkpoints e autovacuum ------------------------------------------
wal_level = replica
max_wal_size = 512MB
min_wal_size = 80MB
checkpoint_timeout = 10min
autovacuum = on
