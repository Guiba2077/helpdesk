# =============================================================================
# pg_hba.conf - Helpdesk TI (Tema G3)
# Montado em /etc/postgresql/pg_hba.conf e carregado com -c hba_file.
#
# As regras sao avaliadas de cima para baixo; a primeira que casa decide.
#  1. Socket local do container: usado pelo entrypoint do Docker na carga
#     inicial (backup.sql), pelo healthcheck (pg_isready) e pelo psql na
#     demonstracao (docker compose exec db psql ...).
#  2. Contas da aplicacao somente a partir dos IPs fixos do PgBouncer e do
#     backend, definidos no docker-compose.yml (rede 172.28.0.0/24), sempre
#     com autenticacao scram-sha-256.
#  3. Qualquer outra origem, inclusive a maquina host pela porta publicada,
#     e rejeitada antes mesmo de pedir senha.
# =============================================================================

# TYPE  DATABASE   USER                    ADDRESS           METHOD
local   all        all                                       trust

host    helpdesk   usr_helpdesk_escritor   172.28.0.20/32    scram-sha-256
host    helpdesk   usr_helpdesk_leitor     172.28.0.20/32    scram-sha-256
host    helpdesk   usr_helpdesk_escritor   172.28.0.30/32    scram-sha-256
host    helpdesk   usr_helpdesk_leitor     172.28.0.30/32    scram-sha-256

host    all        all                     0.0.0.0/0         reject
host    all        all                     ::/0              reject
