;; =============================================================================
;; pgbouncer.ini - Helpdesk TI (Tema G3)
;; Pool de conexoes entre o backend (HikariCP) e o PostgreSQL.
;; Montado em /etc/pgbouncer/pgbouncer.ini pelo docker-compose.yml.
;; =============================================================================

[databases]
helpdesk = host=db port=5432 dbname=helpdesk

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

;; Autenticacao: os clientes (backend) se autenticam no PgBouncer e o PgBouncer
;; se autentica no PostgreSQL, ambos com scram-sha-256.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; Modo transaction: a conexao fisica volta ao pool ao fim de cada transacao.
;; O backend usa set_config(..., true) (escopo de transacao) e prepareThreshold=0
;; no JDBC justamente para funcionar neste modo.
pool_mode = transaction
max_client_conn = 200
default_pool_size = 10
min_pool_size = 2
reserve_pool_size = 3
reserve_pool_timeout = 3
server_idle_timeout = 300
server_lifetime = 1800
server_connect_timeout = 10
query_wait_timeout = 60

;; Parametro de startup enviado pelo driver JDBC que o PgBouncer nao rastreia
ignore_startup_parameters = extra_float_digits

;; Limpeza da conexao fisica (aplicada apenas em pool_mode = session)
server_reset_query = DISCARD ALL

;; Console administrativo:
;;   docker compose exec pgbouncer psql -p 6432 -U usr_helpdesk_escritor pgbouncer
;;   SHOW POOLS; SHOW STATS; SHOW CLIENTS;
admin_users = usr_helpdesk_escritor
stats_users = usr_helpdesk_leitor

log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
