spring.application.name=helpdesk-back
server.port=${SERVER_PORT:8080}

# ==============================================================================
# 1. DataSource Principal — Escrita/Operacional (Role PostgreSQL: rl_escritor)
# Conecta via PgBouncer (porta 6432 no Docker ou 5432 local) com prepareThreshold=0
# ==============================================================================
spring.datasource.jdbc-url=${DB_URL:jdbc:postgresql://localhost:5432/helpdesk?prepareThreshold=0}
spring.datasource.username=${DB_USER_ESCRITOR:usr_helpdesk_escritor}
spring.datasource.password=${DB_PASS_ESCRITOR:escritor123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.maximum-pool-size=10
spring.datasource.minimum-idle=2

# ==============================================================================
# 2. DataSource de Leitura — Auditoria e Relatórios (Role PostgreSQL: rl_leitor)
# ==============================================================================
helpdesk.datasource.leitura.jdbc-url=${DB_URL_LEITURA:${spring.datasource.jdbc-url}}
helpdesk.datasource.leitura.username=${DB_USER_LEITOR:usr_helpdesk_leitor}
helpdesk.datasource.leitura.password=${DB_PASS_LEITOR:leitor123}
helpdesk.datasource.leitura.driver-class-name=org.postgresql.Driver
helpdesk.datasource.leitura.maximum-pool-size=5

# ==============================================================================
# 3. Documentação OpenAPI / Swagger UI
# ==============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
